# golangci-lint configuration
# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  go: "1.24"
  tests: true

linters:
  default: standard

issues:
  max-issues-per-linter: 50
  max-same-issues: 3
  exclude-rules:
    # Relax duplicate/complexity checks in tests
    - path: _test\.go
      linters:
        - dupl
        - gocyclo

    # Exclude SA5011 (nil pointer) in specific test - we explicitly check for nil
    - path: internal/config/migrate_test\.go
      linters:
        - staticcheck
      text: "SA5011"

    # Exclude unused function min - kept for future use
    - path: cmd/gitlab-ci-lint/main\.go
      linters:
        - unused
      text: "func min is unused"

output:
  formats:
    text:
      path: stdout
  print-issued-lines: true
  print-linter-name: true
