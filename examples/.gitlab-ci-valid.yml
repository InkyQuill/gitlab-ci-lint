# Valid GitLab CI configuration example

stages:
  - build
  - test
  - deploy

variables:
  IMAGE_NAME: myapp
  IMAGE_TAG: latest

before_script:
  - echo "Running before script"
  - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker tag $IMAGE_NAME:$IMAGE_TAG $CI_REGISTRY_IMAGE:$IMAGE_TAG
  only:
    - main
    - develop

test:
  stage: test
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - pytest tests/ -v
  coverage: '/TOTAL.+?(\d+\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

deploy:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Deploying to production"
  only:
    - main
  when: manual
